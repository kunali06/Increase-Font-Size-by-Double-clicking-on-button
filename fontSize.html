<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #para{
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

 <p id="text" style="font-size: 16px; cursor: pointer;">
       Kunali Bhavarthe</p>


    <script>
let para=document.getElementById("text")
para.addEventListener("dblclick",()=>{
    let size=parseInt(window.getComputedStyle(para).fontSize);
    para.style.fontSize=(size+10)+"px";
});


    </script>
</body>
</html>
